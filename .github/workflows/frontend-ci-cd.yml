name: Frontend CI/CD
on:
  push:
    branches:
      - Suresh_Devops

  pull_request:
    branches:
      - Suresh_Devops

  workflow_dispatch:

permissions:
  contents: read
  security-events: write


jobs:

  # ============================================================
  # 1. FRONTEND INSTALL AND BUILD
  # ============================================================

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout frontend code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        continue-on-error: true
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build


  # ============================================================
  # 2. FRONTEND SECURITY SCAN
  # ============================================================

  frontend-security-scan:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:

      - name: Checkout frontend code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: NPM security audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Trivy frontend filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./frontend
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true


  # ============================================================
  # 3. DOCKER BUILD
  # ============================================================

  docker-build:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: frontend-security-scan

    steps:

      - name: Checkout frontend code
        uses: actions/checkout@v6

      - name: Build frontend Docker image
        run: |
          docker build \
            -t kts-people360-frontend:${{ github.sha }} \
            -t kts-people360-frontend:latest \
            ./frontend

      - name: Save Docker image
        run: |
          docker save \
            kts-people360-frontend:${{ github.sha }} \
            -o frontend-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v6
        with:
          name: frontend-docker-image
          path: frontend-image.tar


  # ============================================================
  # 4. DOCKER IMAGE SECURITY SCAN
  # ============================================================

  docker-image-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:

      - name: Checkout frontend code
        uses: actions/checkout@v6

      - name: Download Docker image
        uses: actions/download-artifact@v7
        with:
          name: frontend-docker-image

      - name: Load Docker image
        run: |
          docker load -i frontend-image.tar

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kts-people360-frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL


  # ============================================================
  # 5. PUSH DOCKER IMAGE TO DOCKER HUB
  # ============================================================

  docker-push:
    name: Push Frontend Docker Image
    runs-on: ubuntu-latest
    needs: docker-image-scan

    steps:

      - name: Checkout frontend code
        uses: actions/checkout@v6

      - name: Download Docker image
        uses: actions/download-artifact@v7
        with:
          name: frontend-docker-image

      - name: Load Docker image
        run: |
          docker load -i frontend-image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag \
            kts-people360-frontend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-frontend:${{ github.sha }}

          docker tag \
            kts-people360-frontend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-frontend:latest

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-frontend:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-frontend:latest
