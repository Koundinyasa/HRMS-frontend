name: KTS-People360 Frontend CI/CD pipeline 

on:
  push:
    branches:
      - gayathri_devops

  pull_request:
    branches:
      - gayathri_devops

  workflow_dispatch:

env:
  NODE_VERSION: "24"
  DOCKER_IMAGE_FRONTEND: kts-people360-frontend

jobs:

  # ================================================
  # JOB 1: Frontend Build
  # ================================================

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check Node and npm
        run: |
          node --version
          npm --version

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Frontend Lint
        continue-on-error: true
        run: npm run lint

      - name: Build Frontend
        run: npm run build

  # ================================================
  # JOB 2: Security Scan - Frontend
  # ================================================

  security-scan-frontend:
    name: Security Scan Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Frontend Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./frontend
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Frontend Scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend
          path: trivy-frontend.sarif
          if-no-files-found: ignore

  # ================================================
  # JOB 3: Build and Push Frontend Docker Image
  # ================================================

  build-and-push:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest

    needs:
      - build-frontend
      - security-scan-frontend

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================================
  # JOB 4: Docker Image Security Scan
  # ================================================

  image-security-scan:
    name: Frontend Image Security Scan
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
        continue-on-error: true

  # ================================================
  # JOB 5: Deployment Placeholder
  # ================================================

  deploy:
    name: Deployment Information
    runs-on: ubuntu-latest

    needs:
      - image-security-scan

    if: github.ref == 'refs/heads/gayathri_devops' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Deployment Information
        run: |
          echo "=========================================="
          echo "KTS-People360 Frontend Deployment"
          echo "=========================================="
          echo "Branch: gayathri_devops"
          echo "Frontend Image: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest"
          echo "Target: AWS EKS (deployment not configured)"
          echo "=========================================="